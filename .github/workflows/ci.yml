name: CI

# Runs on every push to any branch and on every pull request,
# so both teammates' code is checked the same way.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        # Exit code 5 means "no tests collected yet", which is fine before Round 1.
        run: uv run pytest -q || [ $? -eq 5 ]
