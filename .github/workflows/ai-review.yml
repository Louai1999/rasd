name: AI code review

# Claude reviews every pull request and leaves inline comments where a change
# is needed, plus one summary comment. Uses a Claude Pro/Max subscription:
# create a token with `claude setup-token` and save it as the
# CLAUDE_CODE_OAUTH_TOKEN repository secret. Reviews count toward that
# subscription's usage limits.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Secrets are not available to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for Rasd, an AI agent that handles
            after-sales insurance service tickets. Read CLAUDE.md and docs/spec.md
            for project context.

            Review the diff for:
            - Bugs and logic errors, especially in ticket states and approval gates
            - The safety rule: nothing may reach an insurer, and no payment link may
              reach a customer, without a staff approval (interrupt) first
            - Missing or weak tests for new behaviour
            - Secrets, API keys or real customer data committed by mistake
            - Readability and consistency with the existing code

            Leave an inline comment on each specific line that needs a change, saying
            what is wrong and how to fix it. Then post one short summary comment on the
            pull request with the overall verdict. Be concrete and friendly; skip
            nitpicks that ruff already catches. If everything looks good, say so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
